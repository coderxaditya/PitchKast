<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agenciy® — Create, Impactful</title>
<meta name="description" content="A creative agency building impactful digital experiences." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Loader ─────────────────────────────────────────────── -->
  <div class="loader" id="loader">
    <div class="loader__inner">
      <div class="loader__mark">agenciy<sup>®</sup></div>
      <div class="loader__bar"><span id="loaderFill"></span></div>
      <div class="loader__pct"><span id="loaderPct">0</span><i>%</i></div>
    </div>
  </div>

  <!-- ── Scroll driver + pinned cinematic stage ─────────────── -->
  <div class="track" id="track">
  <div class="stage" id="stage">
    <canvas id="film" class="film"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <!-- Navbar -->
    <header class="nav" id="nav">
      <a class="nav__logo" href="#">agenciy<sup>®</sup></a>

      <nav class="nav__pill" aria-label="Primary">
        <a href="#">Services</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
      </nav>

      <a class="nav__cta" href="#">
        <span>Let's Chat!</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </header>

    <!-- Hero -->
    <div class="hero" id="hero">
      <h1 class="hero__title">
        <span class="line line--1">Create<em>,</em></span>
        <span class="line line--2">Impactful</span>
      </h1>
    </div>

    <!-- Scroll cue -->
    <div class="cue" id="cue" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M6 9.5l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Closing caption -->
    <div class="outro" id="outro">
      <p class="outro__kicker">Partnership</p>
      <p class="outro__line">Every lasting collaboration<br />begins with a handshake.</p>
    </div>

    <!-- Progress rail -->
    <div class="rail" aria-hidden="true"><span id="railFill"></span></div>
  </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
